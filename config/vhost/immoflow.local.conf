<VirtualHost *:80>
    ServerName immoflow.local

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/immoflow-error.log
    CustomLog ${APACHE_LOG_DIR}/immoflow-access.log combined
</VirtualHost>
